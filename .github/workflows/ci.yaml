name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # CI: build and run all tests, including the docker-runtime contract
      # tests (the ubuntu runner has a Docker daemon).
      - name: Build and test
        run: ./mvnw verify -B

      # CD: publish the shaded server jar for pushes to main.
      - name: Upload orkbox.jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: orkbox-${{ github.sha }}
          path: orkbox-server/target/orkbox.jar
