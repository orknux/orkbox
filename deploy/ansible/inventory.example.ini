# Copy to inventory.ini and name your host. Settings go in host_vars/ or
# group_vars/orkbox.yml, the token in Ansible Vault:
#   ansible-vault encrypt_string 'a-long-random-token' --name orkbox_token
#
# On Ubuntu 25.10 and later add ansible_become_exe=sudo.ws: sudo there is
# sudo-rs, whose password prompt Ansible does not recognise.
[orkbox]
box1.example.com ansible_user=admin
