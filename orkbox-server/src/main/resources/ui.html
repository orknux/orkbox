<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orkbox</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2333; --border:#2d3646;
  --text:#e6edf3; --dim:#8b98a9; --accent:#4493f8;
  --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; --orange:#f0883e; --purple:#bc8cff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-weight:600;font-size:16px;letter-spacing:.3px}
.brand .dim{font-weight:400}
nav{display:flex;gap:6px}
.tab{background:none;border:1px solid transparent;color:var(--dim);padding:5px 12px;border-radius:6px;cursor:pointer;font:inherit}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);background:var(--panel2);border-color:var(--border)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--panel2);border:1px solid var(--border);color:var(--dim);font-size:12px;text-align:center}
.auth{margin-left:auto;display:flex;align-items:center;gap:8px}
.auth input{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 9px;font:inherit;width:230px}
.auth input:focus{outline:none;border-color:var(--accent)}
#authState{color:var(--dim);font-size:12px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:16px;max-width:1280px;margin:0 auto}
section[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv .k{color:var(--dim);white-space:nowrap}
.kv code{font-size:12px}
.barlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:8px 0 2px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.warn{background:var(--amber)}
.bar i.high{background:var(--red)}
.status{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.st-ready{color:var(--green);border-color:var(--green);background:rgba(63,185,80,.12)}
.st-creating,.st-stopping{color:var(--amber);border-color:var(--amber);background:rgba(210,153,34,.12)}
.st-stopped{color:var(--dim);border-color:var(--border);background:rgba(139,152,169,.1)}
.st-failed{color:var(--red);border-color:var(--red);background:rgba(248,81,73,.12)}
.ex-running{color:var(--blue);border-color:var(--blue);background:rgba(88,166,255,.12)}
.ex-succeeded{color:var(--green);border-color:var(--green);background:rgba(63,185,80,.12)}
.ex-failed,.ex-timed_out{color:var(--red);border-color:var(--red);background:rgba(248,81,73,.12)}
.ex-killed{color:var(--orange);border-color:var(--orange);background:rgba(240,136,62,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;color:var(--dim);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:1px 9px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(68,147,248,.06)}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
td code{font-size:12px}
.dim{color:var(--dim)}
button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.danger{color:var(--red);border-color:rgba(248,81,73,.5)}
button.danger:hover{border-color:var(--red);background:rgba(248,81,73,.1)}
.toolbar{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.toolbar label{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center}
.toolbar select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 8px;font:inherit;font-size:13px}
.detail{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin:10px 0;padding:12px 14px}
.detail h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtabs{display:flex;gap:6px;margin:10px 0 8px}
.dtab{background:none;border:1px solid transparent;color:var(--dim);padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.dtab.active{color:var(--text);background:var(--panel2);border-color:var(--border)}
.logbox{max-height:420px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.logline{white-space:pre-wrap;word-break:break-word;padding:1px 0;border-bottom:1px solid rgba(45,54,70,.4)}
.logline:last-child{border-bottom:none}
.logline .seq,.logline .at{color:var(--dim)}
.logline .type{font-weight:700;margin:0 8px}
.t-session{color:var(--purple)}
.t-execution{color:var(--blue)}
.t-file{color:var(--green)}
.t-archive{color:var(--orange)}
.logline.output .data{color:var(--dim)}
details summary{cursor:pointer;color:var(--dim)}
pre.out{max-height:420px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
.empty{color:var(--dim);padding:18px;text-align:center}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="brand">orkbox <span class="dim" id="ver"></span></div>
  <nav>
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="sessions">Sessions<span class="badge" id="sessCount" hidden></span></button>
  </nav>
  <div class="auth">
    <input id="token" type="password" placeholder="bearer token" autocomplete="off" spellcheck="false">
    <span id="authState"></span>
  </div>
</header>
<main>
  <section id="tab-overview">
    <div id="sysError" class="card" hidden></div>
    <div class="grid">
      <div class="card"><h2>Server</h2><div class="kv" id="ovServer"></div></div>
      <div class="card"><h2>Host resources</h2><div id="ovHost"></div></div>
      <div class="card"><h2>Runtimes</h2><div id="ovRuntimes"></div></div>
      <div class="card"><h2>Sessions</h2><div id="ovSessions"></div></div>
    </div>
    <div class="card"><h2>Configuration</h2><div class="kv" id="ovConfig"></div></div>
  </section>
  <section id="tab-sessions" hidden>
    <div class="toolbar">
      <label>status <select id="fStatus"><option value="">all</option><option>creating</option><option selected>ready</option><option>stopping</option><option>stopped</option><option>failed</option></select></label>
      <label>runtime <select id="fRuntime"><option value="">all</option></select></label>
      <span class="dim" id="sessMeta"></span>
    </div>
    <table id="sessTable">
      <thead><tr><th>session</th><th>status</th><th>runtime</th><th>image</th><th>created</th><th>ttl</th><th>executions</th><th>memory</th><th>labels</th><th></th></tr></thead>
      <tbody id="sessBody"></tbody>
    </table>
    <div id="sessDetails"></div>
  </section>
</main>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBytes=n=>{if(n==null)return'—';const u=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(n>=100||i===0?0:1)+' '+u[i]};
const fmtClock=t=>{if(!t)return'—';const d=new Date(t);return d.toLocaleTimeString([],{hour12:false})};
const ago=t=>{if(!t)return'';const s=(Date.now()-new Date(t))/1e3;if(s<5)return'just now';if(s<60)return(s|0)+'s ago';if(s<3600)return(s/60|0)+'m ago';if(s<86400)return(s/3600|0)+'h '+(s/3600%60|0)+'m ago';return(s/86400|0)+'d ago'};
const until=t=>{if(!t)return'';const s=(new Date(t)-Date.now())/1e3;if(s<=0)return'expired';if(s<3600)return'for '+(s/60|0)+':'+String(s%60|0).padStart(2,'0');if(s<86400)return'for '+(s/3600|0)+'h '+(s/3600%60|0)+'m';return'for '+(s/86400|0)+'d '+(s/86400%24|0)+'h'};
const dur=ms=>ms==null?'—':ms<1000?ms+'ms':ms<60000?(ms/1000).toFixed(1)+'s':(ms/60000|0)+'m '+(ms/1000%60|0)+'s';
const mb=n=>n==null?'—':n>=1024?(n/1024).toFixed(1)+' GiB':n+' MiB';

const state={
  token:localStorage.getItem('orkbox.token')||'',
  tab:'overview',
  system:null,
  sessions:[],
  tick:0,
  details:new Map(),
};
$('#token').value=state.token;
$('#token').addEventListener('change',e=>{state.token=e.target.value.trim();localStorage.setItem('orkbox.token',state.token);$('#authState').textContent='';refresh()});

async function api(path,opts={}){
  const headers=Object.assign({},opts.headers||{});
  if(state.token)headers['Authorization']='Bearer '+state.token;
  let res;
  try{res=await fetch(path,{...opts,headers})}catch(e){throw new Error('network error: '+e.message)}
  const ct=res.headers.get('content-type')||'';
  const body=ct.includes('json')?await res.json():await res.text();
  if(!res.ok){
    if(res.status===401)$('#authState').textContent='token rejected — enter the server\u2019s bearer token';
    const msg=body&&typeof body==='object'?(body.detail||body.title||res.status):String(body);
    throw new Error(msg);
  }
  if(!state.token)$('#authState').textContent='connected (no auth required)';
  return body;
}
async function fetchOutput(sid,execId,stream,offset){
  const headers=state.token?{Authorization:'Bearer '+state.token}:{};
  const res=await fetch('/v1/sessions/'+sid+'/executions/'+execId+'/output?stream='+stream+'&offset='+offset+'&limit=262144',{headers});
  if(!res.ok){let b;try{b=await res.json()}catch(e){b={}}throw new Error(b.detail||b.title||res.status)}
  return{text:await res.text(),next:Number(res.headers.get('X-Next-Offset')||0),status:res.headers.get('X-Execution-Status')};
}

const statusBadge=s=>'<span class="status st-'+s+'">'+esc(s)+'</span>';
const exBadge=s=>'<span class="status ex-'+s+'">'+esc(s)+'</span>';
function bar(label,usedMb,totalMb){
  if(usedMb==null||totalMb==null)return '';
  const p=totalMb>0?Math.min(100,usedMb/totalMb*100):0;
  const cls=p>90?'high':p>75?'warn':'';
  return '<div class="barlabel"><span>'+label+'</span><span>'+mb(usedMb)+' / '+mb(totalMb)+' \u00b7 free '+mb(Math.max(0,totalMb-usedMb))+'</span></div>'+
    '<div class="bar"><i class="'+cls+'" style="width:'+p.toFixed(1)+'%"></i></div>';
}

async function loadSystem(){
  try{
    const sys=await api('/v1/system');
    state.system=sys;
    const i=sys.info,h=sys.host,s=sys.sessions;
    $('#ver').textContent=i.version;
    $('#ovServer').innerHTML=
      '<span class="k">version</span><span>'+esc(i.version)+'</span>'+
      '<span class="k">started</span><span>'+esc(fmtClock(sys.startedAt))+' ('+ago(sys.startedAt)+')</span>'+
      '<span class="k">uptime</span><span>'+dur(sys.uptimeSeconds*1000)+'</span>'+
      '<span class="k">default runtime</span><span><code>'+esc(i.defaultRuntime)+'</code></span>'+
      '<span class="k">api docs</span><span><a href="/docs">/docs</a> \u00b7 <a href="/openapi.yaml">openapi.yaml</a></span>';
    $('#ovHost').innerHTML=
      '<div class="kv"><span class="k">os</span><span>'+esc(h.os)+'</span>'+
      '<span class="k">arch</span><span>'+esc(h.architecture)+'</span>'+
      '<span class="k">java</span><span>'+esc(h.java)+'</span>'+
      '<span class="k">cpus</span><span>'+h.cpuCores+(h.loadAverage!=null?' \u00b7 load '+h.loadAverage.toFixed(2):'')+'</span></div>'+
      bar('memory',h.memoryUsedMb,h.memoryTotalMb)+
      (h.swapTotalMb>0?bar('swap',h.swapUsedMb,h.swapTotalMb):'')+
      bar('disk',h.diskUsedMb,h.diskTotalMb)+
      bar('jvm heap',h.jvmUsedMb,Math.max(h.jvmMaxMb,h.jvmUsedMb));
    $('#ovRuntimes').innerHTML=i.runtimes.map(r=>
      '<div style="margin-bottom:10px"><b>'+esc(r.name)+'</b> '+(r.available?'<span class="status st-ready">available</span>':'<span class="status st-failed">unavailable</span>')+'</div>'+
      (r.unavailableReason?'<div class="dim" style="font-size:12px;margin:2px 0 6px;word-break:break-word">'+esc(r.unavailableReason)+'</div>':'')+
      '<div class="kv" style="font-size:12px">'
      +(r.workdir?'<span class="k">workdir</span><span><code>'+esc(r.workdir)+'</code></span>':'')
      +(r.shell.length?'<span class="k">shell</span><span><code>'+r.shell.map(esc).join(' ')+'</code></span>':'')
      +(r.defaultImage?'<span class="k">image</span><span><code>'+esc(r.defaultImage)+'</code></span>':'')
      +(r.defaultResources&&r.defaultResources.cpus!=null?'<span class="k">defaults</span><span>'+r.defaultResources.cpus+' cpu \u00b7 '+mb(r.defaultResources.memoryMb)+'</span>':'')
      +(r.caches.length?'<span class="k">caches</span><span>'+r.caches.map(esc).join(', ')+'</span>':'')
      +'</div>').join('');
    $('#ovSessions').innerHTML=
      '<div class="barlabel"><span>active</span><span>'+s.active+' / '+s.maxSessions+'</span></div>'+
      '<div class="bar"><i class="'+(s.active>=s.maxSessions?'high':'')+'" style="width:'+(s.maxSessions>0?s.active/s.maxSessions*100:0).toFixed(1)+'%"></i></div>'+
      '<div class="chips">'+Object.entries(s.byStatus).sort().map(([k,v])=>'<span class="chip">'+esc(k)+': '+v+'</span>').join('')+'</div>'+
      '<div class="kv" style="margin-top:8px;font-size:12px"><span class="k">active limits</span><span>'+s.cpus.toFixed(1)+' cpu \u00b7 '+mb(s.memoryMb)+'</span>'+
      '<span class="k">readable</span><span>'+s.total+' sessions</span></div>';
    $('#ovConfig').innerHTML=
      '<span class="k">session ttl</span><span>default '+(i.defaultTtlSeconds/3600)+' h \u00b7 max '+(i.maxTtlSeconds/3600)+' h</span>'+
      '<span class="k">idle timeout</span><span>'+(i.defaultIdleTimeoutSeconds/60)+' min</span>'+
      '<span class="k">max sessions</span><span>'+i.maxSessions+'</span>';
    $('#sysError').hidden=true;
    const fr=$('#fRuntime');
    if(!fr.dataset.filled){fr.dataset.filled='1';i.runtimes.forEach(r=>{const o=document.createElement('option');o.value=o.textContent=r.name;fr.appendChild(o)})}
  }catch(e){
    $('#sysError').hidden=false;
    $('#sysError').innerHTML='<h2>Cannot reach the API</h2><div class="mono">'+esc(e.message)+'</div><div class="dim" style="font-size:12px;margin-top:6px">Enter the bearer token in the top right (or check the server URL).</div>';
  }
}

async function loadSessions(){
  try{
    const q=new URLSearchParams({limit:'200'});
    const st=$('#fStatus').value,rt=$('#fRuntime').value;
    if(st)q.set('status',st);
    if(rt)q.set('runtime',rt);
    const page=await api('/v1/sessions?'+q);
    state.sessions=page.items;
    $('#sessMeta').textContent=state.sessions.length+' sessions';
    renderSessions();
  }catch(e){$('#sessMeta').textContent='error: '+esc(e.message)}
}
const rank=s=>s.status==='ready'?0:s.status==='creating'?1:s.status==='stopping'?2:3;
function renderSessions(){
  const items=[...state.sessions].sort((a,b)=>rank(a)-rank(b)||b.createdAt.localeCompare(a.createdAt));
  const body=$('#sessBody');
  if(!items.length){
    body.innerHTML='<tr><td colspan="10"><div class="empty">no sessions'+(($('#fStatus').value||$('#fRuntime').value)?' match the filter':' right now')+'</div></td></tr>';
  }else{
    body.innerHTML=items.map(s=>{
      const mem=s.usage&&s.usage.memoryCurrentMb!=null?mb(s.usage.memoryCurrentMb)+(s.usage.memoryPeakMb!=null?' / peak '+mb(s.usage.memoryPeakMb):''):'\u2014';
      const stop=(s.status==='ready'||s.status==='creating'||s.status==='stopping')
        ?'<button class="danger" data-act="stop" data-id="'+esc(s.id)+'">stop</button>':'';
      return '<tr>'+
      '<td class="mono" title="'+esc(s.id)+'">'+esc(s.id)+'</td>'+
      '<td>'+statusBadge(s.status)+(s.failure?'<div class="dim mono" style="max-width:220px;word-break:break-word">'+esc(s.failure)+'</div>':'')+'</td>'+
      '<td>'+esc(s.runtime)+'</td>'+
      '<td class="mono" style="max-width:220px;word-break:break-all">'+(s.image?esc(s.image):'<span class="dim">\u2014</span>')+'</td>'+
      '<td title="'+esc(s.createdAt)+'">'+ago(s.createdAt)+'</td>'+
      '<td title="'+esc(s.expiresAt)+'">'+(s.status==='ready'||s.status==='creating'?until(s.expiresAt):'<span class="dim">'+esc(s.stopReason||'')+'</span>')+'</td>'+
      '<td>'+s.executions.total+(s.executions.running?' <span class="status ex-running">'+s.executions.running+' running</span>':'')+'</td>'+
      '<td>'+mem+'</td>'+
      '<td class="dim" style="font-size:12px;max-width:160px;word-break:break-word">'+Object.entries(s.labels).map(([k,v])=>esc(k)+':'+esc(v)).join(' ')+'</td>'+
      '<td style="white-space:nowrap"><button data-act="toggle" data-id="'+esc(s.id)+'">details</button>'+stop+'</td></tr>';
    }).join('');
  }
  const active=state.sessions.filter(s=>s.status==='ready'||s.status==='creating').length;
  $('#sessCount').hidden=!active;
  $('#sessCount').textContent=active;
  for(const[id,d]of state.details)renderDetail(id,d);
}

async function toggle(id){
  const d=state.details.get(id);
  if(d){d.closed=!d.closed;if(d.closed){renderDetail(id,d);return}loadDetail(d);return}
  state.details.set(id,{id,closed:false,dtab:'events',nextSeq:0,includeOutput:false,events:[],execs:null,out:null,loading:false});
  renderDetail(id,state.details.get(id));
  loadDetail(state.details.get(id));
}

async function loadDetail(d){
  if(d.loading||d.closed)return;
  d.loading=true;
  try{
    d.session=await api('/v1/sessions/'+d.id);
    if(d.session.status!=='creating')d.execs=await api('/v1/sessions/'+d.id+'/executions?limit=100');
    if(d.dtab==='events'&&(!d.session||['creating','ready','stopping'].includes(d.session.status)))await loadEvents(d);
  }catch(e){d.loadError=e.message}
  d.loading=false;
  renderDetail(d.id,d);
}

async function loadEvents(d){
  try{
    const q=new URLSearchParams({since:String(d.nextSeq),limit:'300'});
    if(!d.includeOutput)q.set('types','session.created,session.ready,session.failed,session.updated,session.stopping,session.stopped,execution.started,execution.finished,file.written,file.edited,file.deleted,file.moved,archive.uploaded');
    const page=await api('/v1/sessions/'+d.id+'/logs?'+q);
    d.events=d.events.concat(page.items);
    if(d.events.length>800)d.events=d.events.slice(-800);
    d.nextSeq=page.nextSeq;
    d.eventsError=null;
  }catch(e){d.eventsError=e.message}
}

function renderDetail(id,d){
  let box=$('#detail-'+id);
  if(!box){box=document.createElement('div');box.id='detail-'+id;box.className='detail';$('#sessDetails').appendChild(box)}
  const s=d.session;
  if(d.closed){box.innerHTML='';return}
  if(!s){box.innerHTML='<h3><span class="spin"></span> <span class="mono">'+esc(id)+'</span></h3>';return}
  const meta=[
    s.workdir?('workdir <code>'+esc(s.workdir)+'</code>'):null,
    'network: '+esc(s.network),
    s.caches.length?('caches: '+s.caches.map(esc).join(', ')):null,
    s.resources&&s.resources.cpus!=null?('limits: '+s.resources.cpus+' cpu \u00b7 '+mb(s.resources.memoryMb)):null,
    s.stoppedAt?('stopped '+ago(s.stoppedAt)+' \u2014 '+esc(s.stopReason)):('ttl '+until(s.expiresAt)+' \u00b7 idle '+(s.idleTimeoutSeconds/60)+' min'),
    s.usage&&s.usage.cpuSeconds!=null?('cpu '+s.usage.cpuSeconds.toFixed(1)+'s'):null,
  ].filter(Boolean).join(' &nbsp;\u00b7&nbsp; ');
  box.innerHTML=
    '<h3><span class="mono">'+esc(id)+'</span> '+statusBadge(s.status)+
    (s.failure?'<span class="dim" style="font-size:12px">'+esc(s.failure)+'</span>':'')+
    (d.loadError?'<span class="dim" style="font-size:12px">error: '+esc(d.loadError)+'</span>':'')+
    '<span class="dim" style="font-size:12px">'+meta+'</span>'+
    '<span style="margin-left:auto;white-space:nowrap">'+
    ((s.status==='ready'||s.status==='creating'||s.status==='stopping')?'<button class="danger" data-act="stop" data-id="'+esc(id)+'">stop</button>':'')+
    ' <button data-act="toggle" data-id="'+esc(id)+'">close</button></span></h3>'+
    '<div class="dtabs">'+
    '<button class="dtab '+(d.dtab==='events'?'active':'')+'" data-dtab="events" data-id="'+esc(id)+'">events</button>'+
    '<button class="dtab '+(d.dtab==='execs'?'active':'')+'" data-dtab="execs" data-id="'+esc(id)+'">executions'+(d.execs?' ('+d.execs.items.length+')':'')+'</button>'+
    '</div>'+
    (d.dtab==='events'?eventsHtml(d):execsHtml(d));
}

function eventsHtml(d){
  const lines=d.events.map(ev=>{
    const cls=ev.type.startsWith('session')?'t-session':ev.type.startsWith('execution')?'t-execution':ev.type.startsWith('file')?'t-file':'t-archive';
    const isOut=ev.type==='execution.output';
    let body;
    if(isOut){
      body='<span class="data">['+esc(ev.data.stream||'stdout')+'] '+esc(String(ev.data.text||''))+'</span>';
    }else{
      const data=JSON.stringify(ev.data||{});
      body=data.length>400
        ?'<details><summary class="dim">'+esc(data.slice(0,120))+'\u2026 ('+data.length+' chars)</summary><span class="data" style="color:var(--dim)">'+esc(data)+'</span></details>'
        :'<span class="data">'+esc(data)+'</span>';
    }
    return '<div class="logline'+(isOut?' output':'')+'"><span class="seq">#'+ev.seq+'</span><span class="at">'+esc(fmtClock(ev.at))+'</span><span class="type '+cls+'">'+esc(ev.type)+'</span>'+body+'</div>';
  }).reverse().join('');
  return '<div class="toolbar" style="margin:4px 0">'+
    '<label><input type="checkbox" id="incOut" data-id="'+esc(d.id)+'"'+(d.includeOutput?' checked':'')+'> include execution output</label>'+
    '<span class="dim">'+d.events.length+' events'+(d.eventsError?' \u00b7 <span style="color:var(--red)">'+esc(d.eventsError)+'</span>':'')+(d.nextSeq?' \u00b7 from #'+d.nextSeq:'')+'</span></div>'+
    '<div class="logbox">'+(lines||'<div class="empty">no events yet</div>')+'</div>';
}

function execsHtml(d){
  if(!d.execs)return'<div class="empty"><span class="spin"></span></div>';
  const rows=d.execs.items.map(ex=>{
    const cmd=ex.command||'['+(ex.argv||[]).join(' ')+']';
    return '<tr style="cursor:pointer" data-ex="'+esc(ex.id)+'" data-sid="'+esc(d.id)+'" title="click to view output">'+
    '<td class="mono" title="'+esc(ex.id)+'">'+esc(ex.id)+'</td>'+
    '<td><code style="word-break:break-all">'+esc(cmd.length>110?cmd.slice(0,110)+'\u2026':cmd)+'</code>'+(ex.cwd&&ex.cwd!=='.'?' <span class="dim">'+esc(ex.cwd)+'</span>':'')+'</td>'+
    '<td>'+exBadge(ex.status)+'</td>'+
    '<td>'+(ex.exitCode!=null?ex.exitCode:'\u2014')+(ex.signal?' <span class="dim">'+esc(ex.signal)+'</span>':'')+'</td>'+
    '<td>'+dur(ex.durationMs)+'</td>'+
    '<td>'+fmtBytes(ex.stdoutBytes+ex.stderrBytes)+'</td></tr>';
  }).join('');
  let out='';
  if(d.out){
    const o=d.out;
    out='<div style="margin-top:10px"><div class="toolbar" style="margin:0 0 6px">'+
      '<b class="mono">'+esc(o.execId)+'</b>'+
      '<select id="oStream" data-id="'+esc(d.id)+'">'+['combined','stdout','stderr'].map(s=>'<option'+(o.stream===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
      '<span class="dim">'+esc(o.status||'')+(o.running?' \u00b7 <span class="status ex-running">running</span>':'')+(o.offset?' \u00b7 '+fmtBytes(o.offset)+' bytes shown':'')+'</span>'+
      '<span style="margin-left:auto"><button data-act="outClose" data-id="'+esc(d.id)+'">close</button></span></div>'+
      '<pre class="out">'+esc(o.text||'\u2026')+'</pre></div>';
  }
  return '<table style="margin-top:4px"><thead><tr><th>execution</th><th>command</th><th>status</th><th>exit</th><th>duration</th><th>output</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="6"><div class="empty">no executions</div></td></tr>')+'</tbody></table>'+out;
}

async function openOutput(sid,execId,stream){
  const d=state.details.get(sid);
  if(!d)return;
  d.dtab='execs';
  try{
    const r=await fetchOutput(sid,execId,stream,0);
    d.out={execId,stream,offset:r.next,status:r.status||'running',running:(r.status||'')==='running',text:r.text.slice(-150000)};
  }catch(e){
    d.out={execId,stream,offset:0,status:'error',running:false,text:String(e.message)};
  }
  renderDetail(sid,d);
}

async function stop(id){
  if(!confirm('Stop session '+id+'\nIts commands are killed and the workspace is destroyed.\nThe record and logs stay readable for the retention period.'))return;
  try{
    const s=await api('/v1/sessions/'+id,{method:'DELETE'});
    const d=state.details.get(id);
    if(d&&s)d.session=s;
    await loadSessions();
  }catch(e){alert('stop failed: '+e.message)}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){
    e.preventDefault();
    const act=t.dataset.act,id=t.dataset.id;
    if(act==='toggle')toggle(id);
    else if(act==='stop')stop(id);
    else if(act==='outClose'){const d=state.details.get(id);if(d){d.out=null;renderDetail(id,d)}}
    return;
  }
  const tr=e.target.closest('tr[data-ex]');
  if(tr)openOutput(tr.dataset.sid,tr.dataset.ex,'combined');
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.dtab');
  if(!b)return;
  const d=state.details.get(b.dataset.id);
  if(!d)return;
  d.dtab=b.dataset.dtab;
  if(d.dtab==='events')loadEvents(d).then(()=>renderDetail(d.id,d));
  else renderDetail(d.id,d);
});
document.addEventListener('change',e=>{
  if(e.target.id==='incOut'){
    const d=state.details.get(e.target.dataset.id);
    if(d){d.includeOutput=e.target.checked;d.events=[];d.nextSeq=0;loadEvents(d).then(()=>renderDetail(d.id,d))}
  }
  if(e.target.id==='oStream'){
    const d=state.details.get(e.target.dataset.id);
    if(d&&d.out)openOutput(d.id,d.out.execId,e.target.value);
  }
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  state.tab=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
  $('#tab-overview').hidden=state.tab!=='overview';
  $('#tab-sessions').hidden=state.tab!=='sessions';
  refresh();
}));
$('#fStatus').addEventListener('change',loadSessions);
$('#fRuntime').addEventListener('change',loadSessions);

let refreshing=false;
function refresh(){
  if(refreshing)return;
  refreshing=true;
  (async()=>{
    state.tick++;
    try{
      if(state.tick%3===1||!state.system)await loadSystem();
      if(state.tab==='sessions')await loadSessions();
      for(const [id,d] of state.details){
        if(d.closed)continue;
        if(!d.loading)loadDetail(d);
        if(d.out&&d.out.running){
          try{
            const o=d.out;
            const r=await fetchOutput(id,o.execId,o.stream,o.offset);
            o.offset=r.next;
            o.text=(o.text+r.text).slice(-150000);
            if(r.status){o.status=r.status;o.running=r.status==='running'}
          }catch(err){}
        }
      }
    }catch(e){}
    refreshing=false;
  })();
}
refresh();
setInterval(()=>{if(!document.hidden)refresh()},3000);
</script>
</body>
</html>
